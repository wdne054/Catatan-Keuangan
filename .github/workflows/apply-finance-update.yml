name: Apply finance dashboard update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text()

          old = '''  const [chartPeriod, setChartPeriod] = useState<\n    "7hari" | "14hari" | "30hari"\n  >("7hari");\n'''
          new = '''  const [chartPeriod, setChartPeriod] = useState<\n    "7hari" | "14hari" | "30hari"\n  >("7hari");\n\n  const [historyPeriod, setHistoryPeriod] = useState<\n    "7hari" | "14hari" | "30hari"\n  >("7hari");\n'''
          assert old in text, 'chartPeriod state marker not found'
          text = text.replace(old, new, 1)

          old = '''  const chartDays = useMemo(() => {\n'''
          chart_start = text.index(old)
          chart_end_marker = '''  const chartMax = Math.max(...chartDays.map((item) => item.value), 1);\n'''
          chart_end = text.index(chart_end_marker, chart_start)
          new_chart = '''  const chartDays = useMemo(() => {\n    const days: {\n      date: string;\n      label: string;\n      value: number;\n    }[] = [];\n\n    const now = new Date(currentDate);\n    now.setHours(0, 0, 0, 0);\n\n    const trackingStart = new Date("2026-10-05T00:00:00");\n\n    let startDate: Date;\n    let endDate: Date;\n\n    if (chartPeriod === "7hari") {\n      startDate = startOfWeek(now);\n      endDate = new Date(startDate);\n      endDate.setDate(startDate.getDate() + 6);\n    } else if (chartPeriod === "14hari") {\n      startDate = startOfWeek(now);\n      startDate.setDate(startDate.getDate() - 7);\n      endDate = new Date(startDate);\n      endDate.setDate(startDate.getDate() + 13);\n    } else {\n      startDate = new Date(now.getFullYear(), now.getMonth(), 1);\n      endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);\n      endDate.setHours(0, 0, 0, 0);\n    }\n\n    if (startDate < trackingStart) startDate = new Date(trackingStart);\n\n    for (\n      let date = new Date(startDate);\n      date <= endDate;\n      date.setDate(date.getDate() + 1)\n    ) {\n      const day = new Date(date);\n      const key = getDateKey(day);\n\n      const value = transactions\n        .filter(\n          (item) =>\n            item.date === key && item.category === "Merchant",\n        )\n        .reduce((total, item) => total + item.amount, 0);\n\n      days.push({\n        date: key,\n        label: day.toLocaleDateString("id-ID", {\n          day: "numeric",\n          month: "short",\n        }),\n        value,\n      });\n    }\n\n    return days;\n  }, [transactions, chartPeriod, currentDate]);\n\n  const historyTransactions = useMemo(() => {\n    const now = new Date(currentDate);\n    now.setHours(0, 0, 0, 0);\n\n    const trackingStart = new Date("2026-10-05T00:00:00");\n    let startDate: Date;\n    let endDate: Date;\n\n    if (historyPeriod === "7hari") {\n      startDate = startOfWeek(now);\n      endDate = new Date(startDate);\n      endDate.setDate(startDate.getDate() + 6);\n    } else if (historyPeriod === "14hari") {\n      startDate = startOfWeek(now);\n      startDate.setDate(startDate.getDate() - 7);\n      endDate = new Date(startDate);\n      endDate.setDate(startDate.getDate() + 13);\n    } else {\n      startDate = new Date(now.getFullYear(), now.getMonth(), 1);\n      endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);\n      endDate.setHours(0, 0, 0, 0);\n    }\n\n    if (startDate < trackingStart) startDate = new Date(trackingStart);\n\n    const startKey = getDateKey(startDate);\n    const endKey = getDateKey(endDate);\n\n    return sortedTransactions.filter(\n      (item) => item.date >= startKey && item.date <= endKey,\n    );\n  }, [sortedTransactions, historyPeriod, currentDate]);\n\n  const expenseBreakdown = useMemo(() => {\n    const totals = new Map<string, number>();\n\n    historyTransactions\n      .filter((item) => getCategoryType(item.category) === "expense")\n      .forEach((item) => {\n        const label = item.note?.trim() || item.category;\n        totals.set(label, (totals.get(label) || 0) + item.amount);\n      });\n\n    return Array.from(totals.entries())\n      .map(([label, amount]) => ({ label, amount }))\n      .sort((a, b) => b.amount - a.amount);\n  }, [historyTransactions]);\n\n'''
          text = text[:chart_start] + new_chart + text[chart_end:]

          marker = '''      <section className="all-history-card">'''
          section_start = text.index(marker)
          section_end = text.index('      </section>', section_start) + len('      </section>')
          new_history = '''      <section className="all-history-card">\n        <div className="section-title">\n          <div>\n            <h2>Riwayat Transaksi 🌷</h2>\n            <p>Filter pemasukan & pengeluaran berdasarkan periode</p>\n          </div>\n        </div>\n\n        <div className="recap-tabs" aria-label="Periode riwayat">\n          <button\n            className={historyPeriod === "7hari" ? "active" : ""}\n            onClick={() => setHistoryPeriod("7hari")}\n          >\n            7 Hari\n          </button>\n          <button\n            className={historyPeriod === "14hari" ? "active" : ""}\n            onClick={() => setHistoryPeriod("14hari")}\n          >\n            14 Hari\n          </button>\n          <button\n            className={historyPeriod === "30hari" ? "active" : ""}\n            onClick={() => setHistoryPeriod("30hari")}\n          >\n            1 Bulan\n          </button>\n        </div>\n\n        {historyTransactions.length === 0 ? (\n          <div className="empty-state">\n            <span>🪴</span>\n            <p>Belum ada transaksi di periode ini.</p>\n          </div>\n        ) : (\n          <div className="date-history">\n            {Array.from(new Set(historyTransactions.map((item) => item.date))).map((date) => {\n              const dayTransactions = historyTransactions.filter((item) => item.date === date);\n              const net = getNet(dayTransactions);\n\n              return (\n                <div className="date-history-group" key={date}>\n                  <div className="date-history-heading">\n                    <div>\n                      <strong>{formatDate(date)}</strong>\n                      <small>{dayTransactions.length} transaksi</small>\n                    </div>\n                    <strong className={net >= 0 ? "positive" : "negative"}>\n                      {net >= 0 ? "+" : "-"}{formatRupiah(net)}\n                    </strong>\n                  </div>\n\n                  <div className="date-history-transactions">\n                    {dayTransactions.map((item) => {\n                      const categoryInfo = categories.find(\n                        (category) => category.name === item.category,\n                      );\n                      const type = getCategoryType(item.category);\n\n                      return (\n                        <div className="date-history-transaction" key={item.id}>\n                          <span className="date-history-emoji">\n                            {categoryInfo?.emoji}\n                          </span>\n                          <div className="date-history-detail">\n                            <strong>{item.note || item.category}</strong>\n                          </div>\n\n                          <div className="date-history-actions">\n                            <strong className={type === "income" ? "positive" : "negative"}>\n                              {type === "income" ? "+" : "-"}{formatRupiah(item.amount)}\n                            </strong>\n\n                            <button\n                              onClick={() => editTransaction(item)}\n                              aria-label="Edit transaksi"\n                              type="button"\n                            >\n                              ✏️\n                            </button>\n\n                            <button\n                              onClick={() => deleteTransaction(item.id)}\n                              aria-label="Hapus transaksi"\n                              type="button"\n                            >\n                              🗑️\n                            </button>\n                          </div>\n                        </div>\n                      );\n                    })}\n                  </div>\n                </div>\n              );\n            })}\n          </div>\n        )}\n      </section>'''
          text = text[:section_start] + new_history + text[section_end:]

          marker = '''      <section className="all-history-card">'''
          insert_at = text.index(marker)
          expense_card = '''      <section className="recap-card">\n        <div className="section-title">\n          <div>\n            <h2>💸 Pengeluaran Terbesar</h2>\n            <p>Kelihatan uang paling banyak keluar untuk transaksi apa</p>\n          </div>\n        </div>\n\n        <div className="recap-tabs" aria-label="Periode pengeluaran">\n          <button\n            className={historyPeriod === "7hari" ? "active" : ""}\n            onClick={() => setHistoryPeriod("7hari")}\n          >\n            7 Hari\n          </button>\n          <button\n            className={historyPeriod === "14hari" ? "active" : ""}\n            onClick={() => setHistoryPeriod("14hari")}\n          >\n            14 Hari\n          </button>\n          <button\n            className={historyPeriod === "30hari" ? "active" : ""}\n            onClick={() => setHistoryPeriod("30hari")}\n          >\n            1 Bulan\n          </button>\n        </div>\n\n        {expenseBreakdown.length === 0 ? (\n          <div className="empty-state">\n            <span>🌱</span>\n            <p>Belum ada pengeluaran di periode ini.</p>\n          </div>\n        ) : (\n          <div style={{ display: "grid", gap: "12px", marginTop: "14px" }}>\n            {expenseBreakdown.slice(0, 12).map((item, index) => {\n              const max = expenseBreakdown[0]?.amount || 1;\n              const width = Math.max(3, (item.amount / max) * 100);\n\n              return (\n                <div key={`${item.label}-${index}`}>\n                  <div style={{ display: "flex", justifyContent: "space-between", gap: "10px", alignItems: "center", marginBottom: "6px" }}>\n                    <strong style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>\n                      {item.label}\n                    </strong>\n                    <strong className="negative" style={{ flexShrink: 0 }}>\n                      {formatRupiah(item.amount)}\n                    </strong>\n                  </div>\n                  <div style={{ height: "14px", borderRadius: "999px", background: "#f1e6dc", overflow: "hidden" }}>\n                    <div style={{ width: `${width}%`, height: "100%", borderRadius: "999px", background: "linear-gradient(90deg, #b78667 0%, #d2a98c 100%)" }} />\n                  </div>\n                </div>\n              );\n            })}\n          </div>\n        )}\n      </section>\n\n'''
          text = text[:insert_at] + expense_card + text[insert_at:]

          path.write_text(text)
          print('Patch applied successfully')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add period history and expense breakdown [skip ci]"
          git push

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/apply-finance-update.yml
          git commit -m "chore: remove one-time finance updater [skip ci]"
          git push
