name: Fix chart date labels
on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '''          <div style={{ minWidth: 0 }}>
            <div
              style={{
                position: "relative",
                height: "210px",
                display: "flex",
                alignItems: "flex-end",
                gap: chartDays.length > 14 ? "2px" : "5px",'''
          new = '''          <div
            style={{
              minWidth: 0,
              overflowX: chartDays.length > 14 ? "auto" : "visible",
              overflowY: "hidden",
              WebkitOverflowScrolling: "touch",
              paddingBottom: chartDays.length > 14 ? "6px" : "0",
            }}
          >
            <div
              style={{
                position: "relative",
                height: "210px",
                minWidth: chartDays.length > 14 ? `${chartDays.length * 42}px` : "0",
                display: "flex",
                alignItems: "flex-end",
                gap: chartDays.length > 14 ? "5px" : "5px",'''
          if old not in s:
              raise SystemExit('chart wrapper pattern not found')
          s = s.replace(old, new, 1)
          old2 = '''                gridTemplateColumns: `repeat(${Math.max(chartDays.length, 1)}, minmax(0, 1fr))`,
                gap: chartDays.length > 14 ? "2px" : "5px",
                padding: "7px 2px 0",
              }}'''
          new2 = '''                gridTemplateColumns: `repeat(${Math.max(chartDays.length, 1)}, minmax(0, 1fr))`,
                gap: "5px",
                minWidth: chartDays.length > 14 ? `${chartDays.length * 42}px` : "0",
                padding: "7px 2px 0",
              }}'''
          if old2 not in s:
              raise SystemExit('chart label grid pattern not found')
          s = s.replace(old2, new2, 1)
          old3 = '''                    minWidth: 0,
                    overflow: "hidden",
                    textOverflow: "ellipsis",
                    whiteSpace: "nowrap",
                    textAlign: "center",
                    color: item.date === today ? "#a84d67" : "#806f66",
                    fontSize: chartDays.length > 14 ? "7px" : "9px",'''
          new3 = '''                    minWidth: chartDays.length > 14 ? "37px" : 0,
                    overflow: "visible",
                    textOverflow: "clip",
                    whiteSpace: "nowrap",
                    textAlign: "center",
                    color: item.date === today ? "#a84d67" : "#806f66",
                    fontSize: chartDays.length > 14 ? "9px" : "9px",'''
          if old3 not in s:
              raise SystemExit('chart date label pattern not found')
          s = s.replace(old3, new3, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Make long chart dates readable"
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-chart-dates.yml
          git add .github/workflows/fix-chart-dates.yml
          git diff --cached --quiet || (git commit -m "Remove one-time chart fix workflow" && git push)
